<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Замовлення води</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
</head>
<body>
<div class="container my-4">
    <h2 class="mb-4">📦 Доставка води:</h2>

    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <select class="form-select" id="filterVidpov">
                <option value="">Фільтр: Відповідальний</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="sortBy">
                <option value="">Сортувати за</option>
                <option value="chas_stvor">Час створення</option>
                <option value="suma">Сума</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="filterStat">
                <option value="">Фільтр: Статус</option>
                <option value="true">Завершено</option>
                <option value="false">Незавершено</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-secondary" onclick="loadData()">🔄 Оновити</button>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Створено</th>
            <th>Доставка</th>
            <th>Статус</th>
            <th>Телефон</th>
            <th>Адреса</th>
            <th>Відповідальний</th>
            <th>Сума</th>
            <th>Коментар</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody id="zamovlTableBody">
        <tr id="formRow">
            <td>—</td>
            <td>авто</td>
            <td><input type="datetime-local" id="chas_dost" class="form-control form-control-sm"></td>
            <td>
                <select id="stat" class="form-select form-select-sm">
                    <option value="false">Незавершено</option>
                    <option value="true">Завершено</option>
                </select>
            </td>
            <td><input type="text" id="tel" class="form-control form-control-sm" placeholder="+38 (0__) ___-__-__"></td>
            <td><input type="text" id="adresa" class="form-control form-control-sm"></td>
            <td><input type="text" id="vidpov" class="form-control form-control-sm"></td>
            <td><input type="number" id="suma" class="form-control form-control-sm" step="0.01" min="0"></td>
            <td><input type="text" id="coment" class="form-control form-control-sm"></td>
            <td>
                <button class="btn btn-sm btn-success" onclick="addZamovl()">➕</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    const apiUrl = "/api/my_site/";

    function applyPhoneMask() {
        $("#tel").inputmask("+38 (999) 999-99-99");
    }

    function cleanPhone(raw) {
        return raw.replace(/[^+\d]/g, "");
    }

    function loadData() {
        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("zamovlTableBody");
                const formClone = document.getElementById("formRow").cloneNode(true);
                tbody.innerHTML = "";
                tbody.appendChild(formClone);
                applyPhoneMask();

                const filterStat = document.getElementById("filterStat").value;
                const sortBy = document.getElementById("sortBy").value;
                const filterVidpov = document.getElementById("filterVidpov").value;
                const vidpovSet = new Set();

                if (sortBy) {
                    data.sort((a, b) => a[sortBy] > b[sortBy] ? 1 : -1);
                }

                data.forEach(item => {
                    if (filterStat !== "" && String(item.stat) !== filterStat) return;
                    if (filterVidpov && item.vidpov !== filterVidpov) return;
                    if (item.vidpov) vidpovSet.add(item.vidpov);

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item.id}</td>
                        <td>${new Date(item.chas_stvor).toLocaleString()}</td>
                        <td>${new Date(item.chas_dost).toLocaleString()}</td>
                        <td>${item.stat ? '<span class="badge bg-success">Завершено</span>' : '<span class="badge bg-warning text-dark">Незавершено</span>'}</td>
                        <td>${item.tel}</td>
                        <td>${item.adresa}</td>
                        <td>${item.vidpov}</td>
                        <td>${item.suma} ₴</td>
                        <td>${item.coment || '—'}</td>
                        <td>
                            <button class="btn btn-sm btn-primary me-1" onclick="editZamovl(${item.id})">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteZamovl(${item.id})">🗑</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                const vidpovSelect = document.getElementById("filterVidpov");
                vidpovSelect.innerHTML = '<option value="">Фільтр: Відповідальний</option>';
                [...vidpovSet].sort().forEach(name => {
                    const opt = document.createElement("option");
                    opt.value = name;
                    opt.textContent = name;
                    vidpovSelect.appendChild(opt);
                });
            });
    }

    function getFormData() {
        return {
            tel: cleanPhone(document.getElementById("tel").value.trim()),
            adresa: document.getElementById("adresa").value.trim(),
            suma: parseFloat(document.getElementById("suma").value),
            chas_dost: document.getElementById("chas_dost").value,
            coment: document.getElementById("coment").value.trim(),
            vidpov: document.getElementById("vidpov").value.trim(),
            stat: document.getElementById("stat").value === "true"
        };
    }

    function addZamovl() {
        const data = getFormData();
        if (!data.tel.match(/^\+38\d{10}$/)) return alert("📞 Невірний номер телефону");
        if (!data.adresa) return alert("📍 Вкажіть адресу");
        if (!data.chas_dost) return alert("🕒 Вкажіть час доставки");
        if (isNaN(data.suma) || data.suma <= 0) return alert("💰 Вкажіть коректну суму");

        fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(() => {
            ["tel", "adresa", "suma", "chas_dost", "coment", "vidpov"].forEach(id => document.getElementById(id).value = "");
            document.getElementById("stat").value = "false";
            loadData();
        });
    }

    function deleteZamovl(id) {
        fetch(apiUrl + id + "/", { method: "DELETE" })
            .then(() => loadData());
    }

    function editZamovl(id) {
        const newTel = prompt("Новий номер телефону (у форматі +380...)?", "");
        if (!newTel) return;
        const tel = cleanPhone(newTel);
        if (!tel.match(/^\+38\d{10}$/)) return alert("❌ Формат телефону некоректний");

        fetch(apiUrl + id + "/", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tel })
        }).then(() => loadData());
    }

    ["filterStat", "sortBy", "filterVidpov"].forEach(id =>
        document.getElementById(id).addEventListener("change", loadData)
    );

    loadData();
</script>
</body>
</html>
