<!DOCTYPE html>
<html>
<head>
  <title>Блог</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h1>Вітаю! Це мій міні-сайт "Блог"!</h1>

  <ul class="list-group mt-4">
    <li class="list-group-item">
      <a href="{% url 'about' %}">Про сайт</a>
    </li>
    <li class="list-group-item">
      <form class="row g-2 align-items-center" onsubmit="goToPost(); return false;">
        <div class="col-auto">
          <label for="post-id" class="col-form-label">Перехід до поста №</label>
        </div>
        <div class="col-auto">
          <input type="number" id="post-id" class="form-control" required placeholder="введіть ID">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-sm btn-primary">Перейти</button>
        </div>
      </form>
    </li>

    <li class="list-group-item">
      <a href="{% url 'contact' %}">Контакти</a>
    </li>
    <li class="list-group-item">
      <a href="{% url 'old_contact' %}">Стара контактна</a>
    </li>
    <li class="list-group-item">
      <a href="{% url 'not_found' %}">Сторінка 404</a>
    </li>
  </ul>

  <script>
    function goToPost() {
      const postId = document.getElementById('post-id').value;
      if (postId) {
        window.location.href = `/post/${postId}/`;
      }
    }
  </script>
</body>
</html>
