<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AUTO.RIA Lite{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">

        <nav class="mb-4 text-end">
            {% if user.is_authenticated %}
                Привіт, <strong>{{ user.username }}</strong> |
                <a href="{% url 'profile' %}" class="btn btn-sm btn-outline-primary">Кабінет</a>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Вийти</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-primary">Увійти</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-outline-success">Реєстрація</a>
            {% endif %}
        </nav>

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
