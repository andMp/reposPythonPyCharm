<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product API</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="mb-4">📦 Мої продукти:</h1>

    <!-- Form to add product -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">➕ Додати продукт:</h5>
            <form id="productForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="name" placeholder="Назва товару:" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" class="form-control" id="price" placeholder="Ціна:" step="0.01" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="description" placeholder="Опис товару:">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Додати</button>
            </form>
        </div>
    </div>

    <ul class="list-group" id="productList"></ul>
</div>

<script>
    const apiUrl = "http://127.0.0.1:8000/api/products/";

    function loadProducts() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("productList");
          list.innerHTML = '';
          data.forEach(product => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
              <div>
                <strong>${product.name}</strong> - $${product.price}
                <br><small>${product.description}</small>
              </div>
              <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id})">🗑️</button>
            `;
            list.appendChild(li);
          });
        });
    }

    function deleteProduct(id) {
      fetch(apiUrl + id + "/", {
        method: "DELETE"
      }).then(() => loadProducts());
    }

    document.getElementById("productForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const product = {
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        description: document.getElementById("description").value
      };

      fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
      })
        .then(() => {
          this.reset();
          loadProducts();
        });
    });

    loadProducts();
</script>

</body>
</html>
