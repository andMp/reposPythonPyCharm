
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Дошка оголошень{% endblock %}</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #0044cc;
            color: white;
            padding: 1rem 2rem;
        }

        nav {
            background-color: #eaeaea;
            padding: 0.5rem 2rem;
            font-size: 1.1rem;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #0044cc;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 2rem;
        }

        h2 {
            margin-top: 2rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 0.3rem;
            color: #0044cc;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            background-color: white;
            border: 1px solid #ddd;
            margin-bottom: 0.5rem;
            padding: 1rem;
            border-radius: 6px;
            transition: box-shadow 0.2s;
        }

        li:hover {
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        li a {
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }

        li a:hover {
            color: #0044cc;
        }

        .no-ads {
            font-style: italic;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Дошка оголошень</h1>
    </header>

    <nav>
        Категорії:
        {% for cat in categories %}
            <a href="{% url 'ads_by_category' cat.id %}">{{ cat.name }}</a>
        {% endfor %}
        |
        <a href="{% url 'create_ad' %}">Створити оголошення</a>
    </nav>

    <main>
        {% block content %}
        <!-- Контент сторінки -->
        {% endblock %}
    </main>
</body>
</html>
