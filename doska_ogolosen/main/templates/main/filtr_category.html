<h1>Объявления категории "{{ category.name }}"</h1>
<a href="{% url 'index' %}">Все объявления</a>

<ul>
  {% for ad in ads %}
    <li><a href="{% url 'ad_detail' ad.id %}">{{ ad.title }}</a> ({{ ad.pub_date.date }})</li>
  {% empty %}
    <li>Объявлений нет в этой категории</li>
  {% endfor %}
</ul>
