<!DOCTYPE html>
<html>
<head>
    <title>Онлайн курси</title>
</head>
<body>
    <h1>Список онлайн-курсів</h1>
    {% for course in courses %}
        <div style="margin-bottom: 20px;">
            <h2>{{ course.title }}</h2>
            <p>{{ course.description|truncatechars:100 }}</p>
            <p><strong>Автор:</strong> {{ course.author }}</p>
            <p><strong>Дата:</strong> {{ course.published_date }}</p>
            <a href="{% url 'course_detail' course.pk %}">Докладніше</a>
        </div>
    {% empty %}
        <p>Курсів поки немає.</p>
    {% endfor %}
</body>
</html>
