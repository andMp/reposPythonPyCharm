{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Курси</title>
    <link rel="stylesheet" href="{% static 'main/styles.css' %}">
</head>
<body>
    <div class="container">
        <h1>Список курсів</h1>
        {% for course in courses %}
            <div class="course-card">
                <h2>{{ course.title }}</h2>
                <p>{{ course.short_description|truncatechars:120 }}</p>
                <div class="course-meta">
                    <p>Автор: {{ course.author }}</p>
                    <p>Дата: {{ course.date_published }}</p>
                </div>
                <a href="{% url 'course_detail' course.pk %}" class="btn">Детальніше</a>
            </div>
        {% empty %}
            <p>Немає курсів для відображення.</p>
        {% endfor %}
    </div>
</body>
</html>
