<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Список Завдань</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="mb-4">📋 Список завдань</h1>

    <form id="addForm" class="row g-3 mb-4">
        <div class="col-md-3">
            <input type="text" class="form-control" id="name" placeholder="Назва" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" id="description" placeholder="Опис">
        </div>
        <div class="col-md-3">
            <input type="datetime-local" class="form-control" id="date" required>
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-success">➕ Додати</button>
        </div>
    </form>

    <ul class="list-group" id="taskList"></ul>
</div>

<script>
    const apiUrl = "/api/my_spis_zavd/";

    function loadTasks() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById("taskList");
          list.innerHTML = '';
          data.forEach(task => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `
              <div>
                <strong>${task.name}</strong>
                ${task.stan ? "<span class='badge bg-success ms-2'>✅</span>" : "<span class='badge bg-secondary ms-2'>⏳</span>"}
                <br><small>${task.description}</small><br>
                <small class="text-muted">${new Date(task.date).toLocaleString()}</small>
              </div>
              <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">🗑️</button>
            `;
            list.appendChild(li);
          });
        });
    }

    function deleteTask(id) {
      fetch(apiUrl + id + '/', { method: "DELETE" })
        .then(() => loadTasks());
    }

    document.getElementById("addForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const task = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value,
        date: document.getElementById("date").value,
        stan: false
      };
      fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(task)
      }).then(() => {
        this.reset();
        loadTasks();
      });
    });

    loadTasks();
</script>

</body>
</html>
